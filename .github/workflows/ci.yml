name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Validate Docker Compose file
        working-directory: infra
        run: |
          cp .env.example .env
          docker compose --profile observability config --quiet

  # Kills workers and the API while 1,000 SMS notifications flow, then checks none was lost or
  # sent twice. Runs after the unit and integration tests pass.
  chaos:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package services
        run: ./mvnw -B package -DskipTests

      - name: Chaos test
        run: ./mvnw -B -Pchaos -pl chaos-test verify

      - name: Upload report and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-report
          path: |
            chaos-test/target/chaos-report.md
            chaos-test/target/chaos-logs/
