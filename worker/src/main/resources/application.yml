spring:
  application:
    name: worker
  # Local secrets live in infra/.env (gitignored). The path depends on the working directory.
  config:
    import: optional:file:./infra/.env[.properties],optional:file:../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # How long a dead worker keeps its partitions before Kafka hands them to another.
        session.timeout.ms: ${KAFKA_SESSION_TIMEOUT_MS:45000}
    # Used to publish to retry and dead-letter topics, and by the replay tool.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    listener:
      # Offsets are committed only after the listener returns for the whole poll batch. A
      # failed record is committed only once it has been published to a retry topic.
      ack-mode: batch
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Bounds how long one send can take; must stay well under notifications.delivery.claim-lease.
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SERVER_PORT:8081}

notifications:
  topics:
    email: notifications.email
    sms: notifications.sms
    webhook: notifications.webhook
    # Retry topics get the same partition count, so a retried record keeps its partition.
    partitions: 6
  consumer:
    email-group: email-worker
    sms-group: sms-worker
    webhook-group: webhook-worker
    concurrency: 3
    high-priority-concurrency: 2
  mail:
    from: no-reply@event-notification.local
  sms:
    base-url: ${MOCK_SMS_URL:http://localhost:8082}
    connect-timeout: 2s
    read-timeout: 5s
  webhook:
    # Required. Kept in infra/.env locally; never commit a real one.
    signing-secret: ${WEBHOOK_SIGNING_SECRET}
    connect-timeout: 2s
    read-timeout: 5s
    # Set to true only on a developer machine, to deliver to http://localhost receivers.
    allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
  delivery:
    # Longer than any one send (SMTP worst case 25s, SMS 7s), and shorter than the total
    # retry schedule, so a later retry can take over a dead worker's claim.
    claim-lease: ${CLAIM_LEASE:60s}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # A user over their limit waits for the next free slot, up to this long; beyond it the
    # notification is suppressed rather than queued for hours.
    max-wait: 1h
    channels:
      EMAIL:
        capacity: 20
        refill-period: 3s     # 20 a minute after a burst of 20
      SMS:
        capacity: 5
        refill-period: 12s    # 5 a minute after a burst of 5
    # HIGH priority has its own buckets: enough for a few login codes, not enough to spam a
    # user by requesting password resets in a loop.
    high-priority-channels:
      EMAIL:
        capacity: 5
        refill-period: 1m
      SMS:
        capacity: 3
        refill-period: 1m
  retry:
    # 1 attempt + 5 retries waiting about 2s, 6s, 18s, 54s and 60s: 140s in total.
    attempts: 6
    initial-delay: 2s
    multiplier: 3
    max-delay: 60s
    jitter: 1s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
