# Testcontainers supplies the real connection details; this only satisfies the placeholder.
spring:
  datasource:
    password: test
  # The api module owns the schema. Apply its migrations so tests run against the real tables.
  flyway:
    locations: filesystem:../api/src/main/resources/db/migration

# Short delays so retry and dead-letter tests finish in seconds.
notifications:
  webhook:
    # A test-only secret; the tests deliver to a receiver on 127.0.0.1.
    signing-secret: whsec_gFEooYrtFboec/3WTK9KEtPSZFiJhs36b+clSo+96IA=
    allow-private-targets: true
  sms:
    connect-timeout: 1s
    read-timeout: 1s
  # Generous limits, so tests that send many notifications to one user are not deferred.
  # RedisTokenBucketRateLimiterTest builds its own tight limits.
  rate-limit:
    channels:
      EMAIL:
        capacity: 1000
        refill-period: 1ms
      SMS:
        capacity: 1000
        refill-period: 1ms
    high-priority-channels:
      EMAIL:
        capacity: 1000
        refill-period: 1ms
      SMS:
        capacity: 1000
        refill-period: 1ms
  retry:
    attempts: 4
    initial-delay: 200ms
    multiplier: 2
    max-delay: 1s
    jitter: 50ms
