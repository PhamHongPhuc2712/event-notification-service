spring:
  application:
    name: api
  # Local secrets live in infra/.env (gitignored). The path depends on the working directory.
  config:
    import: optional:file:./infra/.env[.properties],optional:file:../infra/.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:notifications}
    username: ${POSTGRES_USER:notifications}
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      # Keep every producer timeout inside notifications.outbox.send-timeout. Otherwise a batch
      # that timed out would still be sent later and then sent again by the next poll.
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 8000

server:
  port: ${SERVER_PORT:8080}

notifications:
  topics:
    email: notifications.email
    sms: notifications.sms
    webhook: notifications.webhook
    partitions: 6
  outbox:
    poll-interval: 200ms
    batch-size: 100
    send-timeout: 10s
  deferred:
    poll-interval: 5s
    batch-size: 500
  metrics:
    # How often the backlog gauges re-read the outbox and deferred counts from the database.
    backlog-refresh-interval: 5s

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema), ready for a log store. Every entry in
      # the log context becomes a field, such as notificationId. Set LOG_FORMAT to an empty
      # value for readable text in a terminal: LOG_FORMAT= ./mvnw -pl <module> spring-boot:run
      console: ${LOG_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets, so the dashboard can show API response-time percentiles across instances.
      percentiles-histogram:
        http.server.requests: true
