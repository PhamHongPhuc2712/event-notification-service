global:
  scrape_interval: 5s

scrape_configs:
  - job_name: notification-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api
          - host.docker.internal:8081   # worker
          - host.docker.internal:8082   # mock-sms

  # Consumer-group lag, read from the broker, so it is still reported when every worker is down.
  - job_name: kafka
    static_configs:
      - targets:
          - kafka-exporter:9308
